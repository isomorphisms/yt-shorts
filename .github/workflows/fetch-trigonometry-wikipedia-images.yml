name: Fetch trigonometry Wikipedia images

on:
  push:
    branches:
      - trigonometry-notes
    paths:
      - trigonometry/wikipedia-images/download.sh
      - .github/workflows/fetch-trigonometry-wikipedia-images.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigonometry-notes

      - name: Download current Commons originals
        run: bash trigonometry/wikipedia-images/download.sh

      - name: Commit source-image snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- trigonometry/wikipedia-images/assets trigonometry/wikipedia-images/SHA256SUMS)" ]; then
            echo 'source-image snapshot already current'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trigonometry/wikipedia-images/assets trigonometry/wikipedia-images/SHA256SUMS
          git commit -m 'Add Wikipedia trigonometry source images [skip ci]'
          git push origin HEAD:trigonometry-notes
