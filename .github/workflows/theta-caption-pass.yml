name: theta-caption-pass

on:
  pull_request:
    branches: [main]

jobs:
  captions:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch timestamped transcript
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error \
            'https://youtube-transcript.ai/transcript/9xQd9Ab8iNg.txt' \
            -o theta-transcript.txt
          test -s theta-transcript.txt
          echo '===== TRANSCRIPT ====='
          cat theta-transcript.txt
